name: Build diagnostic RS_ASIO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        run: msbuild ".\RS_ASIO.sln" /m /p:Configuration=Release /p:Platform=x86

      - name: Upload diagnostic DLL
        uses: actions/upload-artifact@v4
        with:
          name: rs-asio-debug
          path: |
            bin/Win32/Release/RS_ASIO.dll
            bin/Win32/Release/avrt.dll
